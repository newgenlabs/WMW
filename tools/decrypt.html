<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Decrypt quote request</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px}textarea{width:100%;height:150px;font:12px monospace}button{padding:10px 18px;margin:8px 0}pre{background:#f3f3f1;padding:16px;white-space:pre-wrap}</style></head>
<body><h1>Decrypt a quote request</h1>
<p>Runs entirely in this browser tab. Nothing is uploaded. Open this file from your own computer and keep your private key secret.</p>
<h3>1. Private key (the JSON in PRIVATE-KEY-KEEP-SECRET.json)</h3><textarea id="key"></textarea>
<h3>2. Encrypted message (the text from the email or endpoint)</h3><textarea id="msg"></textarea>
<button id="go">Decrypt</button><pre id="out"></pre>
<script src="decrypt.js"></script></body></html>
